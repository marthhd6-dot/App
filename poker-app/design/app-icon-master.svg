<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="48%" r="75%">
      <stop offset="0%" stop-color="#ff7a1a"/>
      <stop offset="55%" stop-color="#e2350f"/>
      <stop offset="100%" stop-color="#7a0f0a"/>
    </radialGradient>
    <linearGradient id="burst" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#ff9a2e"/>
    </linearGradient>
    <radialGradient id="chip" cx="34%" cy="24%" r="88%">
      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="35%" stop-color="#ffd15c"/>
      <stop offset="72%" stop-color="#f0a627"/>
      <stop offset="100%" stop-color="#a56a10"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe9a0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffe9a0" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Comic-Starburst-Hintergrund: signalisiert "Rumble"/Impact -->
  <polygon points="512.0,-108.0 631.1,67.7 822.0,-24.9 837.3,186.7 1048.9,202.0 956.3,392.9 1132.0,512.0 956.3,631.1 1048.9,822.0 837.3,837.3 822.0,1048.9 631.1,956.3 512.0,1132.0 392.9,956.3 202.0,1048.9 186.7,837.3 -24.9,822.0 67.7,631.1 -108.0,512.0 67.7,392.9 -24.9,202.0 186.7,186.7 202.0,-24.9 392.9,67.7"
    fill="url(#burst)" opacity="0.9"/>

  <!-- Konfetti aus Karten-Symbolen für Party-/Chaos-Stimmung -->
  <g fill="#fff6e0" font-family="DejaVu Sans, sans-serif" font-weight="bold" opacity="0.9">
    <text x="130" y="180" font-size="52" transform="rotate(-18 130 180)">&#9824;</text>
    <text x="900" y="165" font-size="46" fill="#ffd0d0" transform="rotate(16 900 165)">&#9829;</text>
    <text x="905" y="900" font-size="50" fill="#ffe9a8" transform="rotate(24 905 900)">&#9830;</text>
    <text x="110" y="905" font-size="44" fill="#d8fff0" transform="rotate(-16 110 905)">&#9827;</text>
    <text x="540" y="80" font-size="38" fill="#ffb8b8" transform="rotate(8 540 80)">&#9829;</text>
    <text x="560" y="985" font-size="40" fill="#c8f5df" transform="rotate(-10 560 985)">&#9827;</text>
  </g>

  <!-- Zwei gefächerte Spielkarten hinter dem Chip: sorgen für den
       "Karten"-Wunsch aus dem Feedback und zusätzliche Tiefe/Wildheit,
       ohne den Chip selbst zu verdecken (Chip wird danach obendrauf
       gezeichnet). -->
  <g transform="translate(178,748) rotate(-32)">
    <rect x="-130" y="-180" width="260" height="360" rx="26" fill="#fffdf5" stroke="#1a1712" stroke-width="6"/>
    <text x="-98" y="-118" font-family="DejaVu Sans, sans-serif" font-weight="bold" font-size="70" fill="#1a1712">A</text>
    <text x="-100" y="-48" font-family="DejaVu Sans, sans-serif" font-weight="bold" font-size="56" fill="#1a1712">&#9824;</text>
    <text x="0" y="55" font-family="DejaVu Sans, sans-serif" font-weight="bold" font-size="180" fill="#1a1712" text-anchor="middle">&#9824;</text>
  </g>
  <g transform="translate(846,730) rotate(28)">
    <rect x="-130" y="-180" width="260" height="360" rx="26" fill="#fffdf5" stroke="#1a1712" stroke-width="6"/>
    <text x="-98" y="-118" font-family="DejaVu Sans, sans-serif" font-weight="bold" font-size="70" fill="#d81e3c">K</text>
    <text x="-100" y="-48" font-family="DejaVu Sans, sans-serif" font-weight="bold" font-size="56" fill="#d81e3c">&#9829;</text>
    <text x="0" y="55" font-family="DejaVu Sans, sans-serif" font-weight="bold" font-size="180" fill="#d81e3c" text-anchor="middle">&#9829;</text>
  </g>

  <circle cx="512" cy="512" r="410" fill="url(#glow)" filter="url(#blur)"/>

  <!-- Schräg gekippter Chip, gut erkennbar (kein Gesicht): kräftiger
       rot-goldener Kerbenrand plus dynamische Speed-Lines für den
       "wilderen" Auftritt. -->
  <g transform="rotate(-13 512 512)">
    <circle cx="512" cy="512" r="372" fill="url(#chip)"/>

    <g transform="rotate(0 512 512)"><rect x="468.0" y="152.0" width="88.0" height="32.0" rx="8.0" fill="#d81e3c"/></g>
    <g transform="rotate(30 512 512)"><rect x="468.0" y="152.0" width="88.0" height="32.0" rx="8.0" fill="#d81e3c"/></g>
    <g transform="rotate(60 512 512)"><rect x="468.0" y="152.0" width="88.0" height="32.0" rx="8.0" fill="#d81e3c"/></g>
    <g transform="rotate(90 512 512)"><rect x="468.0" y="152.0" width="88.0" height="32.0" rx="8.0" fill="#d81e3c"/></g>
    <g transform="rotate(120 512 512)"><rect x="468.0" y="152.0" width="88.0" height="32.0" rx="8.0" fill="#d81e3c"/></g>
    <g transform="rotate(150 512 512)"><rect x="468.0" y="152.0" width="88.0" height="32.0" rx="8.0" fill="#d81e3c"/></g>
    <g transform="rotate(180 512 512)"><rect x="468.0" y="152.0" width="88.0" height="32.0" rx="8.0" fill="#d81e3c"/></g>
    <g transform="rotate(210 512 512)"><rect x="468.0" y="152.0" width="88.0" height="32.0" rx="8.0" fill="#d81e3c"/></g>
    <g transform="rotate(240 512 512)"><rect x="468.0" y="152.0" width="88.0" height="32.0" rx="8.0" fill="#d81e3c"/></g>
    <g transform="rotate(270 512 512)"><rect x="468.0" y="152.0" width="88.0" height="32.0" rx="8.0" fill="#d81e3c"/></g>
    <g transform="rotate(300 512 512)"><rect x="468.0" y="152.0" width="88.0" height="32.0" rx="8.0" fill="#d81e3c"/></g>
    <g transform="rotate(330 512 512)"><rect x="468.0" y="152.0" width="88.0" height="32.0" rx="8.0" fill="#d81e3c"/></g>

    <circle cx="512" cy="512" r="372" fill="none" stroke="#5c3a08" stroke-opacity="0.55" stroke-width="6"/>
    <circle cx="512" cy="512" r="304" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="8"/>
    <circle cx="512" cy="512" r="280" fill="none" stroke="#a5670f" stroke-opacity="0.4" stroke-width="4"/>

    <!-- Speed-/Impact-Linien statt Gesicht: unterstreichen die
         Drehbewegung des Chips für mehr "wilde" Energie. -->
    <g stroke="#5c3a08" stroke-opacity="0.3" stroke-width="7" stroke-linecap="round">
      <line x1="330" y1="330" x2="270" y2="270"/>
      <line x1="512" y1="255" x2="512" y2="185"/>
      <line x1="694" y1="330" x2="754" y2="270"/>
    </g>

    <ellipse cx="418" cy="330" rx="190" ry="110" fill="#ffffff" opacity="0.22"/>

    <text x="512" y="660" font-family="DejaVu Sans, sans-serif" font-size="460"
      font-weight="bold" fill="#1a1712" text-anchor="middle" stroke="#ffd569" stroke-width="6" paint-order="stroke">&#9824;</text>
  </g>
</svg>
