<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="48%" r="75%">
      <stop offset="0%" stop-color="#ff7a1a"/>
      <stop offset="55%" stop-color="#e2350f"/>
      <stop offset="100%" stop-color="#7a0f0a"/>
    </radialGradient>
    <linearGradient id="burst" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#ff9a2e"/>
    </linearGradient>
    <radialGradient id="chip" cx="34%" cy="24%" r="88%">
      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="35%" stop-color="#ffd15c"/>
      <stop offset="72%" stop-color="#f0a627"/>
      <stop offset="100%" stop-color="#a56a10"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Comic-Starburst-Hintergrund: signalisiert "Rumble"/Impact -->
  <polygon points="512.0,-108.0 631.1,67.7 822.0,-24.9 837.3,186.7 1048.9,202.0 956.3,392.9 1132.0,512.0 956.3,631.1 1048.9,822.0 837.3,837.3 822.0,1048.9 631.1,956.3 512.0,1132.0 392.9,956.3 202.0,1048.9 186.7,837.3 -24.9,822.0 67.7,631.1 -108.0,512.0 67.7,392.9 -24.9,202.0 186.7,186.7 202.0,-24.9 392.9,67.7"
    fill="url(#burst)" opacity="0.9"/>

  <!-- Konfetti aus Karten-Symbolen für Party-/Chaos-Stimmung -->
  <g fill="#fff6e0" font-family="DejaVu Sans, sans-serif" font-weight="bold" opacity="0.92">
    <text x="150" y="200" font-size="60" transform="rotate(-18 150 200)">&#9824;</text>
    <text x="895" y="175" font-size="52" fill="#ffd0d0" transform="rotate(16 895 175)">&#9829;</text>
    <text x="885" y="880" font-size="58" fill="#ffe9a8" transform="rotate(24 885 880)">&#9830;</text>
    <text x="130" y="890" font-size="48" fill="#d8fff0" transform="rotate(-16 130 890)">&#9827;</text>
    <text x="70" y="530" font-size="44" fill="#ffd9a0" transform="rotate(-26 70 530)">&#9830;</text>
    <text x="945" y="520" font-size="50" transform="rotate(30 945 520)">&#9824;</text>
    <text x="540" y="90" font-size="42" fill="#ffb8b8" transform="rotate(8 540 90)">&#9829;</text>
    <text x="560" y="970" font-size="46" fill="#c8f5df" transform="rotate(-10 560 970)">&#9827;</text>
  </g>

  <!-- Schräg gekippter Chip mit wildem Comic-Gesicht -->
  <g transform="rotate(-13 512 512)">
    <circle cx="512" cy="512" r="372" fill="url(#chip)"/>

    <g transform="rotate(0 512 512)"><rect x="468.0" y="152.0" width="88.0" height="32.0" rx="8.0" fill="#d81e3c"/></g>
    <g transform="rotate(30 512 512)"><rect x="468.0" y="152.0" width="88.0" height="32.0" rx="8.0" fill="#d81e3c"/></g>
    <g transform="rotate(60 512 512)"><rect x="468.0" y="152.0" width="88.0" height="32.0" rx="8.0" fill="#d81e3c"/></g>
    <g transform="rotate(90 512 512)"><rect x="468.0" y="152.0" width="88.0" height="32.0" rx="8.0" fill="#d81e3c"/></g>
    <g transform="rotate(120 512 512)"><rect x="468.0" y="152.0" width="88.0" height="32.0" rx="8.0" fill="#d81e3c"/></g>
    <g transform="rotate(150 512 512)"><rect x="468.0" y="152.0" width="88.0" height="32.0" rx="8.0" fill="#d81e3c"/></g>
    <g transform="rotate(180 512 512)"><rect x="468.0" y="152.0" width="88.0" height="32.0" rx="8.0" fill="#d81e3c"/></g>
    <g transform="rotate(210 512 512)"><rect x="468.0" y="152.0" width="88.0" height="32.0" rx="8.0" fill="#d81e3c"/></g>
    <g transform="rotate(240 512 512)"><rect x="468.0" y="152.0" width="88.0" height="32.0" rx="8.0" fill="#d81e3c"/></g>
    <g transform="rotate(270 512 512)"><rect x="468.0" y="152.0" width="88.0" height="32.0" rx="8.0" fill="#d81e3c"/></g>
    <g transform="rotate(300 512 512)"><rect x="468.0" y="152.0" width="88.0" height="32.0" rx="8.0" fill="#d81e3c"/></g>
    <g transform="rotate(330 512 512)"><rect x="468.0" y="152.0" width="88.0" height="32.0" rx="8.0" fill="#d81e3c"/></g>

    <circle cx="512" cy="512" r="372" fill="none" stroke="#5c3a08" stroke-opacity="0.55" stroke-width="6"/>
    <circle cx="512" cy="512" r="304" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="7"/>

    <!-- Augenbrauen: beide nach außen-oben gezogen für einen begeisterten
         Lach-Ausdruck, leicht unterschiedlich groß für den "wilden" Look -->
    <rect x="-50" y="-12" width="100" height="22" rx="11" fill="#1a1712"
      transform="translate(408,362) rotate(-16)"/>
    <rect x="-44" y="-11" width="88" height="20" rx="10" fill="#1a1712"
      transform="translate(610,346) rotate(16)"/>

    <!-- Schielende Augen: beide Pupillen zueinander gedreht = "vom Rumble ganz benommen" -->
    <ellipse cx="418" cy="446" rx="68" ry="76" fill="#fffdf5"/>
    <ellipse cx="418" cy="446" rx="68" ry="76" fill="none" stroke="#1a1712" stroke-width="5"/>
    <circle cx="448" cy="424" r="27" fill="#1a1712"/>
    <circle cx="458" cy="415" r="8" fill="#fff"/>

    <ellipse cx="612" cy="428" rx="57" ry="64" fill="#fffdf5"/>
    <ellipse cx="612" cy="428" rx="57" ry="64" fill="none" stroke="#1a1712" stroke-width="5"/>
    <circle cx="586" cy="409" r="22" fill="#1a1712"/>
    <circle cx="594" cy="401" r="7" fill="#fff"/>

    <!-- Breites Lachen mit Zahnreihe und Zunge statt Schreckensschrei -->
    <ellipse cx="515" cy="612" rx="150" ry="66" fill="#1a1712"/>
    <path d="M425,658 Q515,706 605,658 Q515,684 425,658 Z" fill="#d81e3c"/>
    <g fill="#fffdf5">
      <rect x="382" y="556" width="36" height="28" rx="5"/>
      <rect x="422" y="548" width="36" height="32" rx="5"/>
      <rect x="462" y="544" width="36" height="34" rx="5"/>
      <rect x="502" y="544" width="36" height="34" rx="5"/>
      <rect x="542" y="548" width="36" height="32" rx="5"/>
      <rect x="582" y="556" width="36" height="28" rx="5"/>
    </g>

    <!-- Rote Wangen für den letzten Schuss Albernheit -->
    <ellipse cx="325" cy="555" rx="34" ry="22" fill="#ff5c5c" opacity="0.55" transform="rotate(-14 325 555)"/>
    <ellipse cx="715" cy="535" rx="30" ry="20" fill="#ff5c5c" opacity="0.5" transform="rotate(10 715 535)"/>
  </g>
</svg>
