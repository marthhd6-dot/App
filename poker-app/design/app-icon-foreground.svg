<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="chip" cx="34%" cy="24%" r="88%">
      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="35%" stop-color="#ffd15c"/>
      <stop offset="72%" stop-color="#f0a627"/>
      <stop offset="100%" stop-color="#a56a10"/>
    </radialGradient>
  </defs>

  <!-- Nur der Chip, ohne die gefächerten Karten aus app-icon-master.svg:
       Android setzt den Adaptive-Icon-Vordergrund innerhalb einer runden/
       eckigen Maske zusammen, die weiter außen liegende Elemente
       abschneiden würde – die Karten sind bewusst nur Teil des vollen
       iOS-/Android-Legacy-Icons (siehe app-icon-master.svg), nicht dieser
       Datei. Um denselben Mittelpunkt (512,512) skaliert wie beim Master,
       damit der Chip innerhalb der Safe Zone bleibt. -->
  <g transform="translate(512,512) scale(0.86) translate(-512,-512)">
    <g transform="rotate(-13 512 512)">
      <circle cx="512" cy="512" r="372" fill="url(#chip)"/>

      <g transform="rotate(0 512 512)"><rect x="468.0" y="152.0" width="88.0" height="32.0" rx="8.0" fill="#d81e3c"/></g>
      <g transform="rotate(30 512 512)"><rect x="468.0" y="152.0" width="88.0" height="32.0" rx="8.0" fill="#d81e3c"/></g>
      <g transform="rotate(60 512 512)"><rect x="468.0" y="152.0" width="88.0" height="32.0" rx="8.0" fill="#d81e3c"/></g>
      <g transform="rotate(90 512 512)"><rect x="468.0" y="152.0" width="88.0" height="32.0" rx="8.0" fill="#d81e3c"/></g>
      <g transform="rotate(120 512 512)"><rect x="468.0" y="152.0" width="88.0" height="32.0" rx="8.0" fill="#d81e3c"/></g>
      <g transform="rotate(150 512 512)"><rect x="468.0" y="152.0" width="88.0" height="32.0" rx="8.0" fill="#d81e3c"/></g>
      <g transform="rotate(180 512 512)"><rect x="468.0" y="152.0" width="88.0" height="32.0" rx="8.0" fill="#d81e3c"/></g>
      <g transform="rotate(210 512 512)"><rect x="468.0" y="152.0" width="88.0" height="32.0" rx="8.0" fill="#d81e3c"/></g>
      <g transform="rotate(240 512 512)"><rect x="468.0" y="152.0" width="88.0" height="32.0" rx="8.0" fill="#d81e3c"/></g>
      <g transform="rotate(270 512 512)"><rect x="468.0" y="152.0" width="88.0" height="32.0" rx="8.0" fill="#d81e3c"/></g>
      <g transform="rotate(300 512 512)"><rect x="468.0" y="152.0" width="88.0" height="32.0" rx="8.0" fill="#d81e3c"/></g>
      <g transform="rotate(330 512 512)"><rect x="468.0" y="152.0" width="88.0" height="32.0" rx="8.0" fill="#d81e3c"/></g>

      <circle cx="512" cy="512" r="372" fill="none" stroke="#5c3a08" stroke-opacity="0.55" stroke-width="6"/>
      <circle cx="512" cy="512" r="304" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="8"/>
      <circle cx="512" cy="512" r="280" fill="none" stroke="#a5670f" stroke-opacity="0.4" stroke-width="4"/>

      <g stroke="#5c3a08" stroke-opacity="0.3" stroke-width="7" stroke-linecap="round">
        <line x1="330" y1="330" x2="270" y2="270"/>
        <line x1="512" y1="255" x2="512" y2="185"/>
        <line x1="694" y1="330" x2="754" y2="270"/>
      </g>

      <ellipse cx="418" cy="330" rx="190" ry="110" fill="#ffffff" opacity="0.22"/>

      <text x="512" y="660" font-family="DejaVu Sans, sans-serif" font-size="460"
        font-weight="bold" fill="#1a1712" text-anchor="middle" stroke="#ffd569" stroke-width="6" paint-order="stroke">&#9824;</text>
    </g>
  </g>
</svg>
