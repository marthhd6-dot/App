       als wiederverwendbare Logo-Quelle für die Splash-Screens
       (generate-splash-screens.js bettet diese Datei per verschachteltem
       <svg>-Viewport mittig auf jeder Zielgröße ein, ohne eigene
       Skalierungs-Transforms rechnen zu müssen). Anders als
       app-icon-foreground.svg NICHT auf die Android-Adaptive-Icon-Safe-
       Zone vorskaliert (86%), da Splash-Screens keine solche Maskierung
       kennen. -->
